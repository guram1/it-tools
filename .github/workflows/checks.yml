name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks (JSON-LD, links, sitemap, canonicals, titles, header, SRI)
        run: python3 scripts/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTML validation
        run: npx --yes html-validate@9 --config .htmlvalidate.json "*.html" "tools/*.html"
